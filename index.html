<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Meu Site</h1>
    <p>Bem-vindo ao meu site!</p>
    <button id="vermelho">Vermelho</button>
    <button id="azul">Azul</button>
    <button id="verde">Verde</button>
    <p>Contador: <span id="contador">0</span></p>
    <button id="mais">+</button>
    <button id="menos">-</button>
    <button id="mostrar-esconder">Mostrar/Esconder</button>
    <div id="texto" class="escondido">
        <p>Este é o texto que pode ser mostrado ou escondido.</p>
    </div>
    <h1>Cronômetro</h1>
    <p id="cronometro">00:00</p>
    <button id="iniciar">Iniciar</button>
    <button id="pausar">Pausar</button>
    <button id="resetar">Resetar</button>
    <input type="text" id="tamanho" placeholder="Tamanho da senha">
    <input type="checkbox" id="maiusculas">
    <label for="maiusculas">Letras maiúsculas</label>
    <input type="checkbox" id="numeros">
    <label for="numeros">Números</label>
    <input type="checkbox" id="simbolos">
    <label for="simbolos">Símbolos</label>
    <button id="gerar">Gerar Senha</button>
    <p id="resultado"></p>
    <h1>Galeria de Imagens</h1>
    <div id="galeria">
        <img src="" alt="Imagem" id="imagem">
        <button id="anterior">Anterior</button>
        <button id="proximo">Próxima</button>
    </div>
    <script src="exercicios.js"></script>
</body>
</html>
